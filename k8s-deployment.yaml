apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trade-store-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-store-deployment
  labels:
    app: trade-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-store
  template:
    metadata:
      labels:
        app: trade-store
    spec:
      containers:
        - name: trade-store
          image: trade-store:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_PATH
              value: "/data/trade_store.db"
            - name: EXCEPTION_LOG_PATH
              value: "/data/exceptions.json"
            - name: LOG_PATH
              value: "/data/app.log"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: trade-store-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: trade-store-data
          persistentVolumeClaim:
            claimName: trade-store-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: trade-store-service
spec:
  type: NodePort
  selector:
    app: trade-store
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
