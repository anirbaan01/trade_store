version: '3.8'

services:
  trade-store:
    build:
      context: .
      dockerfile: Dockerfile
    image: trade-store:latest
    container_name: trade-store-app
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/trade_store.db
      - EXCEPTION_LOG_PATH=/data/exceptions.json
      - LOG_PATH=/data/app.log
      - PYTHONUNBUFFERED=1
    volumes:
      - trade-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  trade-data:
    driver: local
